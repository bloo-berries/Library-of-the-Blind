<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n-key="skip_to_content">Skip to main content</a>

  <header role="banner" class="site-header">
    {% include nav.html %}
    {% include accessibility-controls.html %}
  </header>

  <div class="layout-wrapper">
    {% include sidebar.html %}
    <main id="main-content" role="main" tabindex="-1">
      {{ content }}
    </main>
  </div>

  {% include footer.html %}

  <button type="button" class="back-to-top" data-i18n-aria="back_to_top" aria-label="Back to top" hidden>
    <span aria-hidden="true">&uarr;</span>
  </button>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
