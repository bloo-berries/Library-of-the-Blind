<script>
window.LOTB_I18N = {
  {% for lang in site.data.languages %}
  "{{ lang.code }}": {
    {% assign strings = site.data.i18n[lang.code] %}
    {% for pair in strings %}
    "{{ pair[0] }}": {{ pair[1] | jsonify }}{% unless forloop.last %},{% endunless %}
    {% endfor %}
  }{% unless forloop.last %},{% endunless %}
  {% endfor %}
};
window.LOTB_LANGUAGES = [
  {% for lang in site.data.languages %}
  { "code": "{{ lang.code }}", "native": "{{ lang.native }}", "dir": "{{ lang.dir }}" }{% unless forloop.last %},{% endunless %}
  {% endfor %}
];
</script>
