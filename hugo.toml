baseURL = "https://bloo-berries.github.io/Library-of-the-Blind/"
languageCode = "en-us"
title = "Library of the Blind"
contentDir = "content"

[module]
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[params]
  description = "A comprehensive catalog of 323 communication methodologies for the blind and visually impaired"
  favicon = "favicon.svg"

  [params.docs]
    title = "Library of the Blind"
    pathName = "docs"
    sidebarIcons = true
    titleIcon = true
    breadcrumbs = true
    navDesc = true
    navDescTrunc = 50
    toc = true
    tocMobile = true
    scrollSpy = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menu.primary]]
  name = "Docs"
  url = "docs/"
  identifier = "docs"
  weight = 10
